# cargo-deny: the licences, advisories and sources of every dependency (CI's "Licences & advisories").
# The library's own dependencies are bitflags and memchr; the rest are the tests' and the tools'.

[graph]
all-features = true

[licenses]
# Permissive licences only: whatever the engine pulls in must not change what MIT lets others do.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
