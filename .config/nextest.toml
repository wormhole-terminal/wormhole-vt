# cargo-nextest settings: the mutation runs (`scripts/mutants.sh`) and CI use nextest; `cargo test`
# ignores this file.

[profile.default]
# A test that hangs is reported as slow after 15 s and killed after 60 s, instead of holding the job
# until its timeout-minutes. Failures don't stop the run: one pass shows every broken test.
slow-timeout = { period = "15s", terminate-after = 4 }
fail-fast = false

[profile.ci]
retries = 0

# The repaint's bisimulation replays every case and corpus thousands of times: about 30 s in a debug
# build on a laptop, past a minute on a loaded runner. Slow by design, not hung; give it four minutes.
[[profile.ci.overrides]]
filter = 'binary_id(wormhole-vt-bench::bisimulation)'
slow-timeout = { period = "60s", terminate-after = 4 }

# Mutation runs (scripts/mutants.sh): the first failing test decides that a mutant is caught, so the
# rest of the suite need not run (the default profile runs it all, to show every broken test).
# `fail-fast = { max-fail = 1, terminate = "immediate" }` would also kill the tests still running at
# the first failure, but `terminate` needs nextest 0.9.111 and the install is not pinned (nor is a
# developer's), so the plain form stays: running tests finish, nothing new starts.
[profile.mutants]
fail-fast = true

# The same bisimulation allowance as the ci profile: killing it at the default minute would count a
# slow runner as a caught repaint mutant.
[[profile.mutants.overrides]]
filter = 'binary_id(wormhole-vt-bench::bisimulation)'
slow-timeout = { period = "60s", terminate-after = 4 }
